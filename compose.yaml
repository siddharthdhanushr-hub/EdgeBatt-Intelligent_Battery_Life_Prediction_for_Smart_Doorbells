services:
  battery-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: edgeai1-battery-api:latest
    container_name: edgeai1-battery-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
